# Illustrative routing only. The gateway is not part of the implemented scope.
upstream farm_management_service    { server farm-management-service:8001; }
upstream telemetry_service          { server telemetry-service:8002; }
upstream irrigation_control_service { server irrigation-control-service:8003; }

server {
    listen 80;
    location /api/v1/farms      { proxy_pass http://farm_management_service; }
    location /api/v1/telemetry  { proxy_pass http://telemetry_service; }
    location /api/v1/irrigation { proxy_pass http://irrigation_control_service; }
}
